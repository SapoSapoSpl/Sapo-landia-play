<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cadastro • SAPOLANDIA</title><link rel="stylesheet" href="style.css"></head><body><header class="top"><a class="brand" href="index.html"><img src="assets/frog.svg">SAPOLANDIA PLAY</a><a href="index.html"><button class="secondary">Voltar</button></a></header><main><div class="panel"><h1>Cadastro / Entrar</h1><p class="muted">Perfil local de demonstração para liberar jogos.</p><label>Nome<input id="name" class="field" placeholder="Seu nome"></label><label>E-mail<input id="email" class="field" type="email" placeholder="voce@email.com"></label><label>Senha<input id="pass" class="field" type="password" placeholder="mínimo 6 caracteres"></label><button onclick="register()">Criar cadastro</button> <button class="secondary" onclick="login()">Já tenho cadastro</button><p id="msg" class="notice"></p><div class="notice">Bônus visual: R$ 30 (não é saldo financeiro).</div></div></main><script>function register(){let n=name.value.trim(),e=email.value.trim(),p=pass.value;if(!n||!e||p.length<6){msg.textContent='Preencha tudo e use senha de 6 caracteres ou mais.';return}localStorage.setItem('spl_user',JSON.stringify({name:n,email:e}));msg.textContent='Cadastro local concluído! Jogos liberados.';let next=new URLSearchParams(location.search).get('next');if(next)setTimeout(()=>location.href='games/'+next+'.html',700)}function login(){let e=email.value.trim(),u=JSON.parse(localStorage.getItem('spl_user')||'null');if(u&&u.email===e){msg.textContent='Login reconhecido neste navegador.';let next=new URLSearchParams(location.search).get('next');if(next)setTimeout(()=>location.href='games/'+next+'.html',700)}else msg.textContent='Conta não encontrada localmente; faça o cadastro.'}</script></body></html>
